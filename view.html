<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invoice · Invora</title>
<link rel="icon" href="assets/icon.png">
<style>
  :root{--navy:#112844;--cream:#F4EFE4;--border:#E7E2D5;--muted:#63707F;--indigo:#2A5381}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#E9E4D8;color:var(--navy);min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(244,239,228,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
  .brand img{width:28px;height:28px}
  .brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
  .actions{display:flex;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--border);background:#fff;color:var(--navy);cursor:pointer}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 10px 40px}
  canvas{background:#fff;box-shadow:0 12px 40px rgba(17,40,68,.18);border-radius:6px;max-width:100%;height:auto}
  .state{margin:60px auto;text-align:center;color:var(--muted);max-width:420px;line-height:1.5}
  .state h1{font-size:20px;color:var(--navy);margin-bottom:8px}
  .spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--indigo);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
  @keyframes s{to{transform:rotate(360deg)}}
  footer{text-align:center;padding:16px;font-size:12.5px;color:var(--muted)}
  footer a{color:var(--indigo);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="assets/logo.svg" alt="">Invora<small id="num"></small></div>
  <div class="actions">
    <a class="btn" id="open" target="_blank" rel="noopener" hidden>Open</a>
    <a class="btn primary" id="download" hidden>Download PDF</a>
  </div>
</header>
<main id="main">
  <div class="state" id="state"><div class="spin"></div>Loading your invoice…</div>
</main>
<footer>Sent with <a href="https://goinvora.com">Invora</a> — invoices made effortless.</footer>

<!-- PDF.js (Mozilla) from a CDN; pinned version. -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs" type="module"></script>
<script type="module">
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';

  // The function that owns the read receipt + signed URLs (see supabase/functions/view-invoice).
  const FUNCTIONS_BASE = 'https://ojerckbyvevgaihlhwab.functions.supabase.co';
  const token = new URLSearchParams(location.search).get('token');
  const state = document.getElementById('state');
  const main = document.getElementById('main');

  function fail(title, msg){
    state.innerHTML = `<h1>${title}</h1>${msg}`;
  }

  (async () => {
    if (!token) return fail('Link incomplete', 'This invoice link is missing its token. Ask the sender to share it again.');
    let meta;
    try {
      const r = await fetch(`${FUNCTIONS_BASE}/view-invoice?token=${encodeURIComponent(token)}&format=json`);
      if (!r.ok) throw new Error(String(r.status));
      meta = await r.json();
    } catch (e) {
      return fail('This invoice link is no longer available', 'It may have been revoked or replaced by a newer version. Please contact the sender.');
    }
    // Header actions.
    const dl = document.getElementById('download'); dl.href = meta.downloadUrl; dl.download = meta.name || 'invoice.pdf'; dl.hidden = false;
    const op = document.getElementById('open'); op.href = meta.url; op.hidden = false;
    if (meta.name) document.getElementById('num').textContent = meta.name.replace(/^Invoice-|\.pdf$/g,'');

    // Render every page inline (Android browsers otherwise force a download).
    try {
      const pdf = await pdfjsLib.getDocument({ url: meta.url }).promise;
      state.remove();
      const width = Math.min(document.documentElement.clientWidth - 20, 900);
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const scale = (width / base.width) * (window.devicePixelRatio || 1);
        const vp = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = vp.width; canvas.height = vp.height;
        canvas.style.width = `${vp.width / (window.devicePixelRatio || 1)}px`;
        main.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }
    } catch (e) {
      // Rendering failed (old browser, blocked CDN): fall back to the PDF itself.
      location.replace(meta.url);
    }
  })();
</script>
</body>
</html>
